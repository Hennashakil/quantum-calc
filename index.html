<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QuantumCalc | Futuristic Scientific Calculator</title>
    <meta name="description" content="A premium, ultra-modern scientific calculator with AI-level design, glassmorphism, and advanced math capabilities.">
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&family=Orbitron:wght@400;700&display=swap" rel="stylesheet">
    
    <!-- Libraries -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/mathjs/11.8.0/math.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <style>
        :root {
            /* Color Palette */
            --bg-dark: #050506;
            --primary: #00f2ff;
            --primary-glow: rgba(0, 242, 255, 0.5);
            --secondary: #bc13fe;
            --secondary-glow: rgba(188, 19, 254, 0.5);
            --accent: #ff007a;
            --glass: rgba(255, 255, 255, 0.03);
            --glass-border: rgba(255, 255, 255, 0.1);
            --text-main: #e0e0e0;
            --text-dim: #a0a0a0;
            
            /* Shadows & Effects */
            --shadow-neon: 0 0 15px var(--primary-glow);
            --glass-blur: blur(20px);
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        [data-theme="light"] {
            --bg-dark: #f0f2f5;
            --text-main: #1a1a1a;
            --text-dim: #4a4a4a;
            --glass: rgba(0, 0, 0, 0.05);
            --glass-border: rgba(0, 0, 0, 0.1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
            -webkit-font-smoothing: antialiased;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            overflow-x: hidden;
            min-height: 100vh;
        }

        /* --- Animated Background --- */
        .bg-gradient {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -2;
            background: radial-gradient(circle at 50% 50%, #1a1a2e 0%, #050506 100%);
        }

        .mesh-gradient {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            opacity: 0.4;
            filter: blur(80px);
            animation: meshMove 20s infinite alternate;
        }

        .mesh-blob {
            position: absolute;
            width: 50vw;
            height: 50vw;
            border-radius: 50%;
        }

        .blob-1 { background: var(--primary); top: -10%; left: -10%; animation: float1 15s infinite; }
        .blob-2 { background: var(--secondary); bottom: -10%; right: -10%; animation: float2 18s infinite; }
        .blob-3 { background: var(--accent); top: 50%; left: 50%; transform: translate(-50%, -50%); animation: float3 25s infinite; }

        @keyframes meshMove {
            0% { transform: scale(1) rotate(0deg); }
            100% { transform: scale(1.2) rotate(10deg); }
        }

        @keyframes float1 {
            0% { transform: translate(0, 0); }
            100% { transform: translate(20%, 30%); }
        }

        @keyframes float2 {
            0% { transform: translate(0, 0); }
            100% { transform: translate(-30%, -20%); }
        }

        @keyframes float3 {
            0% { transform: translate(-50%, -50%) scale(1); }
            100% { transform: translate(-40%, -60%) scale(1.1); }
        }

        #particles-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            pointer-events: none;
        }

        /* --- Navbar --- */
        nav {
            position: sticky;
            top: 0;
            width: 100%;
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            backdrop-filter: var(--glass-blur);
            border-bottom: 1px solid var(--glass-border);
            z-index: 1000;
            background: var(--glass);
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 10px;
            font-family: 'Orbitron', sans-serif;
            font-weight: 700;
            font-size: 1.5rem;
            letter-spacing: 2px;
            background: linear-gradient(45deg, var(--primary), var(--secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .nav-right {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .clock {
            font-family: 'Orbitron', sans-serif;
            font-size: 0.9rem;
            color: var(--primary);
            text-shadow: var(--shadow-neon);
        }

        .icon-btn {
            background: none;
            border: none;
            color: var(--text-main);
            cursor: pointer;
            transition: var(--transition);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 8px;
            border-radius: 50%;
        }

        .icon-btn:hover {
            background: var(--glass-border);
            color: var(--primary);
            transform: scale(1.1);
        }

        /* --- Layout --- */
        main {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 2rem;
            min-height: calc(100vh - 70px);
            gap: 3rem;
        }

        /* --- Calculator Card --- */
        .calc-container {
            position: relative;
            width: 100%;
            max-width: 400px;
            background: var(--glass);
            backdrop-filter: var(--glass-blur);
            border: 1px solid var(--glass-border);
            border-radius: 32px;
            padding: 24px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            transition: transform 0.1s ease-out;
            cursor: grab;
        }

        .calc-container:active {
            cursor: grabbing;
        }

        .calc-display {
            background: rgba(0, 0, 0, 0.2);
            border-radius: 20px;
            padding: 24px;
            margin-bottom: 24px;
            text-align: right;
            border: 1px solid var(--glass-border);
            min-height: 120px;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            gap: 8px;
            position: relative;
            overflow: hidden;
        }

        .display-preview {
            font-size: 1rem;
            color: var(--text-dim);
            height: 1.2rem;
            overflow: hidden;
            white-space: nowrap;
        }

        .display-main {
            font-family: 'Orbitron', sans-serif;
            font-size: 2.5rem;
            font-weight: 700;
            color: var(--primary);
            text-shadow: var(--shadow-neon);
            word-break: break-all;
            line-height: 1.2;
        }

        .calc-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
        }

        .btn {
            aspect-ratio: 1;
            border: 1px solid var(--glass-border);
            border-radius: 18px;
            background: var(--glass);
            color: var(--text-main);
            font-size: 1.2rem;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
        }

        .btn:hover {
            background: rgba(255, 255, 255, 0.1);
            border-color: var(--primary);
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(0, 242, 255, 0.2);
        }

        .btn:active {
            transform: translateY(0) scale(0.95);
        }

        .btn-op { color: var(--secondary); }
        .btn-sci { color: var(--primary); font-size: 0.9rem; }
        .btn-eq { 
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: white;
            grid-column: span 1;
            box-shadow: 0 0 20px var(--primary-glow);
        }
        .btn-eq:hover {
            box-shadow: 0 0 30px var(--primary-glow);
        }

        /* --- Footer / FAB --- */
        .fab-container {
            position: fixed;
            bottom: 30px;
            right: 30px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        /* --- Sidebar --- */
        .sidebar {
            position: fixed;
            right: -350px;
            top: 0;
            width: 350px;
            height: 100vh;
            background: var(--glass);
            backdrop-filter: var(--glass-blur);
            border-left: 1px solid var(--glass-border);
            z-index: 2000;
            padding: 80px 24px 24px;
            transition: var(--transition);
        }

        .sidebar.open {
            right: 0;
        }

        .sidebar-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
        }

        .history-list {
            display: flex;
            flex-direction: column;
            gap: 16px;
            overflow-y: auto;
            max-height: calc(100vh - 200px);
        }

        .history-item {
            background: rgba(255, 255, 255, 0.03);
            padding: 16px;
            border-radius: 12px;
            border: 1px solid var(--glass-border);
            cursor: pointer;
            transition: var(--transition);
        }

        .history-item:hover {
            background: rgba(255, 255, 255, 0.08);
        }

        /* --- Responsive --- */
        @media (max-width: 600px) {
            .calc-container {
                max-width: 100%;
                border-radius: 0;
                height: 100vh;
                top: 0 !important;
                left: 0 !important;
                position: fixed;
            }
        }
    </style>
</head>
<body>

    <!-- Background Elements -->
    <div class="bg-gradient"></div>
    <div class="mesh-gradient">
        <div class="mesh-blob blob-1"></div>
        <div class="mesh-blob blob-2"></div>
        <div class="mesh-blob blob-3"></div>
    </div>
    <canvas id="particles-canvas"></canvas>

    <!-- Navbar -->
    <nav>
        <div class="logo">
            <i data-lucide="zap"></i>
            QUANTUM CALC
        </div>
        <div class="nav-right">
            <div class="clock" id="digital-clock">00:00:00</div>
            <button class="icon-btn" id="theme-toggle" title="Toggle Theme">
                <i data-lucide="moon"></i>
            </button>
            <button class="icon-btn" id="history-toggle" title="View History">
                <i data-lucide="history"></i>
            </button>
        </div>
    </nav>

    <main>
        <!-- Calculator Section -->
        <div class="calc-container" id="draggable-calc">
            <div class="calc-mode-selector">
                <button class="mode-btn active" data-mode="basic">Basic</button>
                <button class="mode-btn" data-mode="sci">Scientific</button>
                <button class="mode-btn" data-mode="matrix">Matrix</button>
            </div>

            <div class="calc-display">
                <div class="display-preview" id="expression-preview"></div>
                <div class="display-main" id="main-display">0</div>
            </div>
            
            <div class="calc-grid" id="calc-buttons">
                <!-- Buttons are generated by JS -->
            </div>

            <div class="ai-assistant" id="ai-suggestion">
                <i data-lucide="sparkles"></i>
                <span id="ai-text">Type something to see suggestions...</span>
            </div>
        </div>

        <!-- Extra Modules -->
        <div class="extra-modules" id="extra-modules">
            <div class="module-card glass" id="graphing-section">
                <div class="module-header">
                    <h3><i data-lucide="area-chart"></i> Function Plotter</h3>
                    <div class="input-group">
                        <span>f(x) = </span>
                        <input type="text" id="graph-input" placeholder="e.g. sin(x) * x" value="sin(x)">
                        <button class="btn-sm" onclick="plotGraph()">Plot</button>
                    </div>
                </div>
                <canvas id="graph-canvas"></canvas>
            </div>

            <div class="module-row">
                <div class="module-card glass" id="unit-converter">
                    <h3><i data-lucide="repeat"></i> Unit Converter</h3>
                    <div class="converter-grid">
                        <input type="number" id="unit-from-val" value="1">
                        <select id="unit-from-type">
                            <option value="m">Meters</option>
                            <option value="km">Kilometers</option>
                            <option value="inch">Inches</option>
                            <option value="ft">Feet</option>
                        </select>
                        <i data-lucide="arrow-right"></i>
                        <select id="unit-to-type">
                            <option value="km">Kilometers</option>
                            <option value="m">Meters</option>
                            <option value="inch">Inches</option>
                            <option value="ft">Feet</option>
                        </select>
                        <div class="unit-result" id="unit-result">0.001</div>
                    </div>
                </div>

                <div class="module-card glass" id="matrix-section" style="display: none;">
                    <h3><i data-lucide="grid-3x3"></i> Matrix Operations</h3>
                    <div class="matrix-input">
                        <textarea id="matrix-a" placeholder="[1, 2; 3, 4]"></textarea>
                        <select id="matrix-op">
                            <option value="det">Determinant</option>
                            <option value="inv">Inverse</option>
                            <option value="transpose">Transpose</option>
                        </select>
                        <button class="btn-sm" onclick="runMatrixOp()">Calculate</button>
                    </div>
                    <div class="matrix-result" id="matrix-result">Result will appear here</div>
                </div>
            </div>
        </div>
    </main>

    <!-- Sidebar -->
    <aside class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <h3>History</h3>
            <button class="icon-btn" id="clear-history">
                <i data-lucide="trash-2"></i>
            </button>
        </div>
        <div class="history-list" id="history-list"></div>
        <div class="sidebar-footer">
            <button class="btn-eq" style="width: 100%; height: 40px; border-radius: 10px;" onclick="exportHistory()">Export History</button>
        </div>
    </aside>

    <!-- UI Overlay for Voice -->
    <div id="voice-overlay" class="voice-overlay">
        <div class="voice-ripple"></div>
        <i data-lucide="mic"></i>
        <p>Listening...</p>
    </div>

    <script>
        // --- State Management ---
        let currentExpression = '';
        let lastResult = null;
        let memoryValue = 0;
        let currentMode = 'basic';
        let history = JSON.parse(localStorage.getItem('calc-history') || '[]');

        const displayMain = document.getElementById('main-display');
        const displayPreview = document.getElementById('expression-preview');
        const aiText = document.getElementById('ai-text');
        const btnGrid = document.getElementById('calc-buttons');

        // --- Button Configurations ---
        const basicButtons = [
            { label: 'C', type: 'func', val: 'clear' }, { label: '()', type: 'func', val: 'brackets' }, { label: '%', type: 'func', val: '%' }, { label: '÷', type: 'op', val: '/' },
            { label: '7', type: 'num' }, { label: '8', type: 'num' }, { label: '9', type: 'num' }, { label: '×', type: 'op', val: '*' },
            { label: '4', type: 'num' }, { label: '5', type: 'num' }, { label: '6', type: 'num' }, { label: '−', type: 'op', val: '-' },
            { label: '1', type: 'num' }, { label: '2', type: 'num' }, { label: '3', type: 'num' }, { label: '+', type: 'op', val: '+' },
            { label: '±', type: 'func', val: 'negate' }, { label: '0', type: 'num' }, { label: '.', type: 'num' }, { label: '=', type: 'eq' }
        ];

        const scientificButtons = [
            { label: 'sin', type: 'sci' }, { label: 'cos', type: 'sci' }, { label: 'tan', type: 'sci' }, { label: 'log', type: 'sci' },
            { label: 'ln', type: 'sci' }, { label: '√', type: 'sci', val: 'sqrt' }, { label: 'x²', type: 'sci', val: '^2' }, { label: 'xʸ', type: 'sci', val: '^' },
            { label: 'π', type: 'sci', val: 'pi' }, { label: 'e', type: 'sci', val: 'e' }, { label: '!', type: 'sci' }, { label: 'inv', type: 'sci' },
            ...basicButtons
        ];

        // --- Sound Effects ---
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        function playClickSound() {
            const oscillator = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();
            oscillator.connect(gainNode);
            gainNode.connect(audioCtx.destination);
            oscillator.type = 'sine';
            oscillator.frequency.setValueAtTime(440, audioCtx.currentTime);
            gainNode.gain.setValueAtTime(0.1, audioCtx.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(0.00001, audioCtx.currentTime + 0.1);
            oscillator.start();
            oscillator.stop(audioCtx.currentTime + 0.1);
        }

        // --- Core Calculator Logic ---
        function updateUI() {
            displayMain.textContent = currentExpression || '0';
            if (currentExpression) {
                try {
                    const preview = math.evaluate(currentExpression.replace(/×/g, '*').replace(/÷/g, '/'));
                    displayPreview.textContent = preview;
                    updateAISuggestion(currentExpression);
                } catch (e) {
                    displayPreview.textContent = '';
                }
            } else {
                displayPreview.textContent = '';
            }
        }

        function handleInput(val, type) {
            playClickSound();
            if (type === 'num' || type === 'op' || type === 'sci') {
                if (['sin', 'cos', 'tan', 'log', 'sqrt'].includes(val)) {
                    currentExpression += val + '(';
                } else if (val === 'pi') {
                    currentExpression += 'pi';
                } else if (val === 'e') {
                    currentExpression += 'e';
                } else {
                    currentExpression += val;
                }
            } else if (val === 'clear') {
                currentExpression = '';
            } else if (val === 'brackets') {
                const openCount = (currentExpression.match(/\(/g) || []).length;
                const closeCount = (currentExpression.match(/\)/g) || []).length;
                currentExpression += openCount > closeCount ? ')' : '(';
            } else if (val === 'negate') {
                if (currentExpression.startsWith('-')) currentExpression = currentExpression.slice(1);
                else currentExpression = '-' + currentExpression;
            } else if (val === '=') {
                evaluateExpression();
            }
            updateUI();
        }

        function evaluateExpression() {
            try {
                const result = math.evaluate(currentExpression.replace(/×/g, '*').replace(/÷/g, '/'));
                addToHistory(currentExpression, result);
                currentExpression = result.toString();
                lastResult = result;
            } catch (e) {
                displayMain.textContent = 'Error';
                setTimeout(() => updateUI(), 1000);
            }
        }

        // --- AI Assistant Mock ---
        function updateAISuggestion(expr) {
            if (expr.includes('pi')) aiText.textContent = "Using Pi? 2 * pi * r is the circumference of a circle.";
            else if (expr.includes('sin')) aiText.textContent = "Calculating sine? Remember it's Opposite / Hypotenuse.";
            else if (expr.match(/\d+ \+ \d+/)) aiText.textContent = "Addition detected. Tip: You can also use percentage with %.";
            else aiText.textContent = "I'm here to help with your calculations!";
        }

        // --- History ---
        function addToHistory(expr, res) {
            history.unshift({ expr, res, time: new Date().toLocaleTimeString() });
            if (history.length > 20) history.pop();
            localStorage.setItem('calc-history', JSON.stringify(history));
            renderHistory();
        }

        function renderHistory() {
            const container = document.getElementById('history-list');
            container.innerHTML = history.map(item => `
                <div class="history-item" onclick="currentExpression='${item.res}'; updateUI()">
                    <div style="font-size: 0.8rem; color: var(--text-dim)">${item.expr}</div>
                    <div style="font-size: 1.1rem; color: var(--primary)">= ${item.res}</div>
                    <div style="font-size: 0.6rem; text-align: right">${item.time}</div>
                </div>
            `).join('');
        }

        // --- Graphing ---
        let chart = null;
        function plotGraph() {
            const expr = document.getElementById('graph-input').value;
            const xValues = math.range(-10, 10, 0.5).toArray();
            const yValues = xValues.map(x => {
                try { return math.evaluate(expr, { x }); } 
                catch (e) { return null; }
            });

            const ctx = document.getElementById('graph-canvas').getContext('2d');
            if (chart) chart.destroy();
            chart = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: xValues,
                    datasets: [{
                        label: `f(x) = ${expr}`,
                        data: yValues,
                        borderColor: '#00f2ff',
                        backgroundColor: 'rgba(0, 242, 255, 0.1)',
                        borderWidth: 2,
                        tension: 0.4,
                        fill: true
                    }]
                },
                options: {
                    responsive: true,
                    scales: {
                        x: { grid: { color: 'rgba(255, 255, 255, 0.1)' }, ticks: { color: '#a0a0a0' } },
                        y: { grid: { color: 'rgba(255, 255, 255, 0.1)' }, ticks: { color: '#a0a0a0' } }
                    },
                    plugins: { legend: { labels: { color: '#e0e0e0' } } }
                }
            });
        }

        // --- Mode Switching ---
        function renderButtons(mode) {
            btnGrid.innerHTML = '';
            const list = mode === 'sci' ? scientificButtons : basicButtons;
            list.forEach(btn => {
                const button = document.createElement('button');
                button.className = `btn ${btn.type === 'op' ? 'btn-op' : ''} ${btn.type === 'eq' ? 'btn-eq' : ''} ${btn.type === 'sci' ? 'btn-sci' : ''}`;
                button.textContent = btn.label;
                button.onclick = () => handleInput(btn.val || btn.label, btn.type);
                btnGrid.appendChild(button);
            });
        }

        document.querySelectorAll('.mode-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                currentMode = btn.dataset.mode;
                renderButtons(currentMode);
                document.getElementById('matrix-section').style.display = currentMode === 'matrix' ? 'block' : 'none';
            });
        });

        // --- Memory Functions ---
        function handleMemory(op) {
            playClickSound();
            const val = parseFloat(displayMain.textContent) || 0;
            switch(op) {
                case 'MC': memoryValue = 0; break;
                case 'MR': currentExpression = memoryValue.toString(); updateUI(); break;
                case 'M+': memoryValue += val; break;
                case 'M-': memoryValue -= val; break;
            }
        }

        // --- Matrix Operations ---
        function runMatrixOp() {
            const matrixA = document.getElementById('matrix-a').value;
            const op = document.getElementById('matrix-op').value;
            try {
                const a = math.matrix(JSON.parse(matrixA.replace(/;/g, ',')));
                let res;
                if (op === 'det') res = math.det(a);
                else if (op === 'inv') res = math.inv(a);
                else if (op === 'transpose') res = math.transpose(a);
                document.getElementById('matrix-result').textContent = JSON.stringify(res, null, 2);
            } catch (e) {
                document.getElementById('matrix-result').textContent = 'Invalid Matrix Format: [[1,2],[3,4]]';
            }
        }

        // --- Unit Converter ---
        function updateUnitConversion() {
            const val = document.getElementById('unit-from-val').value;
            const from = document.getElementById('unit-from-type').value;
            const to = document.getElementById('unit-to-type').value;
            try {
                const res = math.unit(parseFloat(val), from).toNumber(to);
                document.getElementById('unit-result').textContent = res.toFixed(4);
            } catch (e) {
                document.getElementById('unit-result').textContent = 'Error';
            }
        }
        document.getElementById('unit-from-val').addEventListener('input', updateUnitConversion);
        document.getElementById('unit-from-type').addEventListener('change', updateUnitConversion);
        document.getElementById('unit-to-type').addEventListener('change', updateUnitConversion);

        // --- Voice Input ---
        const voiceOverlay = document.getElementById('voice-overlay');
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (SpeechRecognition) {
            const recognition = new SpeechRecognition();
            recognition.onresult = (event) => {
                const transcript = event.results[0][0].transcript;
                currentExpression = transcript.replace(/plus/g, '+').replace(/minus/g, '-').replace(/times/g, '*').replace(/divided by/g, '/');
                updateUI();
                voiceOverlay.classList.remove('active');
            };
            recognition.onend = () => voiceOverlay.classList.remove('active');
            
            // Add a mic button to navbar
            const micBtn = document.createElement('button');
            micBtn.className = 'icon-btn';
            micBtn.innerHTML = '<i data-lucide="mic"></i>';
            micBtn.onclick = () => {
                voiceOverlay.classList.add('active');
                recognition.start();
            };
            document.querySelector('.nav-right').prepend(micBtn);
            lucide.createIcons();
        }

        // --- Keyboard Support ---
        document.addEventListener('keydown', (e) => {
            if (document.activeElement.tagName === 'INPUT' || document.activeElement.tagName === 'TEXTAREA') return;
            if (e.key >= '0' && e.key <= '9') handleInput(e.key, 'num');
            if (['+', '-', '*', '/'].includes(e.key)) handleInput(e.key === '*' ? '×' : e.key === '/' ? '÷' : e.key, 'op');
            if (e.key === 'Enter') handleInput('=', 'eq');
            if (e.key === 'Escape') handleInput('clear', 'func');
            if (e.key === 'Backspace') {
                currentExpression = currentExpression.slice(0, -1);
                updateUI();
            }
        });

        // --- Export History ---
        function exportHistory() {
            const blob = new Blob([JSON.stringify(history, null, 2)], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'calc-history.json';
            a.click();
        }

        // --- 3D Tilt Effect ---
        const card = document.getElementById('draggable-calc');
        card.addEventListener('mousemove', (e) => {
            if (isDragging) return;
            const rect = card.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;
            const centerX = rect.width / 2;
            const centerY = rect.height / 2;
            const rotateX = (y - centerY) / 10;
            const rotateY = (centerX - x) / 10;
            card.style.transform = `perspective(1000px) rotateX(${rotateX}deg) rotateY(${rotateY}deg)`;
        });
        card.addEventListener('mouseleave', () => {
            if (!isDragging) card.style.transform = `perspective(1000px) rotateX(0deg) rotateY(0deg)`;
        });

        // --- Final Cleanup & Loader ---
        window.addEventListener('load', () => {
            setTimeout(() => {
                const loader = document.createElement('div');
                loader.id = 'loader';
                loader.style = 'position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #050506; z-index: 9999; display: flex; flex-direction: column; align-items: center; justify-content: center; transition: opacity 0.5s;';
                loader.innerHTML = `
                    <div class="logo" style="font-size: 2.5rem; animation: pulse 1.5s infinite; flex-direction: column;">
                        <i data-lucide="zap" style="width: 64px; height: 64px; color: var(--primary)"></i>
                        <span style="margin-top: 20px;">QUANTUM CORE v1.0</span>
                    </div>
                    <div style="width: 200px; height: 2px; background: var(--glass-border); margin-top: 30px; border-radius: 2px; overflow: hidden;">
                        <div id="loader-bar" style="width: 0%; height: 100%; background: var(--primary); box-shadow: 0 0 10px var(--primary);"></div>
                    </div>
                `;
                document.body.appendChild(loader);
                lucide.createIcons();

                let progress = 0;
                const interval = setInterval(() => {
                    progress += Math.random() * 20;
                    if (progress >= 100) {
                        progress = 100;
                        clearInterval(interval);
                        setTimeout(() => {
                            loader.style.opacity = '0';
                            setTimeout(() => loader.remove(), 500);
                        }, 500);
                    }
                    document.getElementById('loader-bar').style.width = progress + '%';
                }, 100);
            }, 0);
        });

        // Re-render buttons for basic initially
        renderButtons('basic');

    </script>
